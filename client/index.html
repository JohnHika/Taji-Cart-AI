    <script>
      // Remove legacy service-worker caches once, then reload into the current Vite release.
      // This prevents old offline assets from mixing with a newly deployed hashed bundle.
      (() => {
        const cleanupKey = 'nawiri-cache-cleanup-v1';
        if (!('serviceWorker' in navigator) || sessionStorage.getItem(cleanupKey)) return;

        window.addEventListener('load', async () => {
          try {
            const [registrations, cacheNames] = await Promise.all([
              navigator.serviceWorker.getRegistrations(),
              'caches' in window ? caches.keys() : Promise.resolve([]),
            ]);

            if (registrations.length === 0 && cacheNames.length === 0) return;

            await Promise.all(registrations.map((registration) => registration.unregister()));
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            sessionStorage.setItem(cleanupKey, 'done');
            window.location.reload();
          } catch (error) {
            console.warn('Legacy cache cleanup skipped:', error);
          }
        }, { once: true });
      })();
    </script>
